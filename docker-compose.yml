services:
  # Definicja bazy danych postgres
  postgres:
    image: postgres:16-alpine
    container_name: stafflou_db
    restart: always
    # Zmienne srodowiskowe
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Mapowanie portow
    ports:
      - "5435:5432"
    # Wolumeny
    volumes:
      - hr_pg_data:/var/lib/postgresql/data

# Definicja wolumenow
volumes:
  hr_pg_data:

